plugins {
    id 'fabric-loom' version '1.12-SNAPSHOT'
    id 'maven-publish'
}

java { withSourcesJar() }

version = project.mod_version
group   = project.archives_base_name

base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

loom {
    mods {
        "${project.archives_base_name}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft         "com.mojang:minecraft:${project.minecraft_version}"
    mappings          "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Compile against roscraft.  Replace this with a Maven dependency when
    // roscraft-api is published:
    //   modCompileOnly "net.roscraft:roscraft-api:${project.roscraft_api_version}"
    //
    // For local development, point at the built roscraft mod JAR.
    // Build roscraft first:  cd ../.. && ./gradlew build
    if (project.hasProperty('roscraft_jar_path')) {
        modCompileOnly files(project.roscraft_jar_path)
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}
