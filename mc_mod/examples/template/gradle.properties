# Template addon — copy this directory to start your own roscraft addon.
#
# 1. Copy this entire template/ directory to a new location.
# 2. Rename your.mod → your.actual.package in src/main/java/ and fabric.mod.json.
# 3. Edit gradle.properties: set roscraft_jar_path to your roscraft mod JAR.
# 4. Run ./gradlew build

org.gradle.jvmargs=-Xmx1G

# Fabric versions — match your server
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.5
fabric_version=0.102.0+1.21.1

# Mod metadata
mod_version=0.1.0
archives_base_name=roscraft-template-addon

# Path to roscraft mod JAR for compilation.
# Build roscraft first, then point this at mc_mod/build/libs/roscraft-*.jar.
roscraft_jar_path=../../build/libs/roscraft-1.21.1.jar

# Used when roscraft-api is published to Maven (future)
roscraft_api_version=1.21.1
