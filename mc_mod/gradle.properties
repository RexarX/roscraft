# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.5

# Mod Properties
mod_version=1.21.1
maven_group=net.roscraft
archives_base_name=roscraft

# Dependencies
fabric_version=0.102.0+1.21.1
modmenu_version=11.0.4

# ---------------------------------------------------------------------------
# FlatBuffers
# ---------------------------------------------------------------------------
# Minimum flatc major.minor — checked at build time (warning only, not fatal).
# Keep this aligned with the runtime below.
flatbuffers_min_version=25.0
# Runtime dependency version. Use any 25.x available on Maven.
flatbuffers_version=25.+
# Path to the flatc compiler. Override with -PflatcPath=/path/to/flatc
flatc_path=flatc

# ---------------------------------------------------------------------------
# Repository layout
# ---------------------------------------------------------------------------
# Path to the roscraft repository root. Used to find:
#   <roscraft_root>/schemas/bridge_packets.fbs
# Legacy layout is also supported:
#   <roscraft_root>/roscraft/schemas/bridge_packets.fbs
# Override when building from outside the repo:
#   ./gradlew build -ProscraftRoot=/absolute/path/to/roscraft
roscraft_root=..

# ---------------------------------------------------------------------------
# Native library (roscraft_bridge_jni) auto-discovery
# ---------------------------------------------------------------------------
# The build probes <cmake_build_dir> for the shared library and copies it
# into the mod jar when found. Build succeeds without it (network-only mode).
# Probe order: lib/ → install/lib/ → Release/lib/ → RelWithDebInfo/lib/
# Override with -PcmakeBuildDir=/path or -PnativeLibDir=/path/to/lib/dir
cmake_build_dir=../roscraft_ws/build
