plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.diffplug.spotless' version '7.0.+'
}

repositories {
    mavenCentral()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

version = project.mod_version
group   = project.maven_group

base {
    archivesName = 'roscraft-api'
}

// Compiled into the main mod via `api project(':roscraft-api')` in ../build.gradle.
// This subproject also publishes roscraft-api for external addon authors.
//
// To publish:  ./gradlew :roscraft-api:publishToMavenLocal

spotless {
    java {
        target "src/**/*.java"
        targetExclude "build/**"
        palantirJavaFormat('2.38.0').style("GOOGLE")
        removeUnusedImports()
        lineEndings "UNIX"
    }
}

build.dependsOn("spotlessCheck")

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId    = project.maven_group
            artifactId = 'roscraft-api'
            version    = project.mod_version
            from components.java
        }
    }
}
